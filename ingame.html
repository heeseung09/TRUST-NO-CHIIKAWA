<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05040a">
  <title>TRUST NO CHIIKAWA - 게임 플레이</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #05040a;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: min(100vw, calc(100vh * (360 / 640)));
      height: min(100vh, calc(100vw * (640 / 360)));
      aspect-ratio: 360 / 640;
      position: relative;
      background-color: #07060c;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      isolation: isolate;
      display: flex;
      flex-direction: column;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
    }

    .game-header {
      position: relative;
      z-index: 5;
      padding: 12px 14px 8px;
      background: rgba(13, 16, 28, 0.9);
      border-bottom: 1.5px solid rgba(163, 78, 72, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .round-badge {
      font-size: 13px;
      font-weight: 800;
      color: #ff9ebb;
      background: rgba(255, 120, 150, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 120, 150, 0.25);
    }

    .wall-status-bar {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(8, 10, 18, 0.85);
    }

    .hp-box {
      flex: 1;
      background: rgba(20, 24, 38, 0.85);
      border: 1px solid rgba(163, 78, 72, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hp-label { font-size: 11px; color: #9ba3b7; font-weight: 600; }
    .hp-value { font-size: 15px; font-weight: 900; color: #ff6b6b; }
    .hp-value.inner { color: #52c41a; }

    .role-card {
      position: relative;
      z-index: 5;
      margin: 8px 14px;
      padding: 8px 12px;
      background: linear-gradient(135deg, rgba(30, 20, 32, 0.9) 0%, rgba(15, 18, 30, 0.9) 100%);
      border: 1.5px solid #a34e48;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-title { font-size: 12px; color: #d0d6e5; }
    .role-secret { font-size: 13.5px; font-weight: 800; color: #ffd700; }
    .role-secret.monster { color: #ff4d4f; }

    .main-stage {
      position: relative;
      z-index: 5;
      flex: 1;
      margin: 0 14px 10px;
      padding: 10px;
      background: rgba(15, 18, 30, 0.9);
      border: 1px solid rgba(163, 78, 72, 0.25);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .stage-title {
      font-size: 13px;
      font-weight: 800;
      color: #f6e8db;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .game-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
    }

    .btn-yes { background: #2e7d32; }
    .btn-no { background: #c62828; }
    .btn-sub { background: #1565c0; }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hand-cards {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .card-item {
      flex: 1;
      height: 42px;
      background: #23293e;
      border: 1.5px solid #3d486b;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
    }

    .card-item.selected {
      border-color: #ff85a2;
      background: #8e2632;
    }

    .log-box {
      height: 75px;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      padding: 6px 8px;
      font-size: 11px;
      color: #aaa;
      border-radius: 6px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .select-item {
      padding: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .select-item.selected {
      border-color: #ff85a2;
      background: rgba(142, 38, 50, 0.4);
    }
  </style>
</head>
<body>

  <main class="canvas-container">
    <img class="bg-image" src="트러스트_노_치이카와_배경.png" onerror="this.onerror=null; this.src='트러스트 노 치이카와 배경.png';" alt="배경">

    <header class="game-header">
      <div class="round-badge" id="round-text">ROUND 1 / 5</div>
      <div style="font-size: 11px; color: #8890a3;">부결 횟수: <span id="fail-count" style="color:#ff6b6b; font-weight:bold;">0</span></div>
    </header>

    <section class="wall-status-bar">
      <div class="hp-box">
        <span class="hp-label">🛡️ 외벽 HP</span>
        <span class="hp-value" id="wall-hp">20</span>
      </div>
      <div class="hp-box">
        <span class="hp-label">🏰 내벽 HP</span>
        <span class="hp-value inner" id="watchtower-hp">25</span>
      </div>
    </section>

    <section class="role-card">
      <span class="role-title">내 정체 & 아이템</span>
      <span class="role-secret" id="role-text">확인 중...</span>
    </section>

    <section class="main-stage">
      <div class="stage-title">
        <span id="phase-title">페이즈 진행 중</span>
        <span id="mayor-badge" style="font-size:11px; color:#ffd700;"></span>
      </div>

      <div class="content-area" id="stage-content">
        <!-- 현재 페이즈별 동적 HTML 삽입 -->
      </div>

      <div class="log-box" id="game-log">게임 서버에 접속 중입니다...</div>
    </section>
  </main>

<script>
  (() => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || '1000';
    const playerId = urlParams.get('pid') || ('p' + String(Math.floor(Math.random() * 10000)));
    const initNick = urlParams.get('nick') || '치이카와';

    const roundText = document.getElementById('round-text');
    const failCountText = document.getElementById('fail-count');
    const wallHpText = document.getElementById('wall-hp');
    const watchtowerHpText = document.getElementById('watchtower-hp');
    const roleText = document.getElementById('role-text');
    const phaseTitle = document.getElementById('phase-title');
    const mayorBadge = document.getElementById('mayor-badge');
    const stageContent = document.getElementById('stage-content');
    const gameLog = document.getElementById('game-log');

    let currentGameState = null;
    let selectedTargets = [];
    let selectedCard = null;

    function log(msg) {
      gameLog.innerHTML += `<div>${msg}</div>`;
      gameLog.scrollTop = gameLog.scrollHeight;
    }

    const RENDER_HTTP = 'https://trust-no-chiikawa.onrender.com';
    const RENDER_WS = 'wss://trust-no-chiikawa.onrender.com';

    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '';
    const HTTP_URL = isLocal ? `http://${location.hostname || 'localhost'}:8000` : RENDER_HTTP;
    const WS_URL = isLocal ? `ws://${location.hostname || 'localhost'}:8000` : RENDER_WS;

    fetch(`${HTTP_URL}/health`).catch(() => {});

    let ws = new WebSocket(`${WS_URL}/ws/${roomId}/${playerId}`);

    ws.onopen = () => {
      log('서버 연결 성공');
      ws.send(JSON.stringify({ type: 'JOIN', name: initNick }));
    };

    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);

      if (data.type === 'STATE_UPDATE') {
        currentGameState = data;
        renderGameState(data);
      } else if (data.type === 'VOTE_RESULT') {
        const res = data.data;
        log(`[투표 결과] ${res.passed ? '✅ 가결' : '❌ 부결'} (찬성: ${res.yes}, 반대: ${res.no})`);
      } else if (data.type === 'BATTLE_RESULT') {
        const res = data.data;
        log(`[결산] 외벽 HP: ${res.wall_hp}, 내벽 HP: ${res.watchtower_hp}`);
      }
    };

    ws.onclose = () => log('서버 연결 종료');

    function renderGameState(state) {
      roundText.textContent = `ROUND ${state.current_round} / 5`;
      failCountText.textContent = state.failed_votes_count || 0;
      wallHpText.textContent = state.wall_hp ?? 20;
      watchtowerHpText.textContent = state.watchtower_hp ?? 25;

      const me = state.me || {};
      const isMonster = me.role === 'MONSTER';
      roleText.textContent = `${isMonster ? '😈 괴물' : '🛡️ 시민'} (${me.item || '아이템 없음'})`;
      roleText.className = `role-secret ${isMonster ? 'monster' : ''}`;

      mayorBadge.textContent = me.is_mayor ? '👑 내가 이장' : '';

      const phase = state.phase;
      stageContent.innerHTML = '';

      if (phase === 'NOMINATING') {
        phaseTitle.textContent = '📜 토벌조 지명 페이즈';
        const reqCount = state.current_round === 1 ? 3 : 4;

        if (me.is_mayor) {
          stageContent.innerHTML = `
            <div style="font-size:12px; margin-bottom:6px;">토벌조로 지명할 플레이어 ${reqCount}명을 선택하세요:</div>
            <div id="nominate-list" style="display:flex; flex-direction:column; gap:4px;"></div>
            <button class="game-btn btn-sub" id="btn-nominate" style="margin-top:8px;" disabled>지명 완료</button>
          `;

          const nomList = document.getElementById('nominate-list');
          selectedTargets = [];

          state.players.forEach(p => {
            const item = document.createElement('div');
            item.className = 'select-item';
            item.innerHTML = `<span>${p.name}</span><span>${p.is_mayor ? '👑' : ''}</span>`;
            item.onclick = () => {
              if (selectedTargets.includes(p.player_id)) {
                selectedTargets = selectedTargets.filter(id => id !== p.player_id);
                item.classList.remove('selected');
              } else {
                if (selectedTargets.length < reqCount) {
                  selectedTargets.push(p.player_id);
                  item.classList.add('selected');
                }
              }
              document.getElementById('btn-nominate').disabled = (selectedTargets.length !== reqCount);
            };
            nomList.appendChild(item);
          });

          document.getElementById('btn-nominate').onclick = () => {
            ws.send(JSON.stringify({ type: 'NOMINATE', target_ids: selectedTargets }));
          };
        } else {
          stageContent.innerHTML = `<div style="font-size:13px; text-align:center; padding:20px; color:#aaa;">이장이 토벌조를 지명하는 중입니다...</div>`;
        }

      } else if (phase === 'VOTING') {
        phaseTitle.textContent = '🗳️ 찬반 투표 페이즈';
        const expNames = state.players
          .filter(p => (state.expedition_ids || []).includes(p.player_id))
          .map(p => p.name).join(', ');

        stageContent.innerHTML = `
          <div style="font-size:12px; margin-bottom:8px;">지명된 토벌조: <strong style="color:#ff9ebb;">${expNames}</strong></div>
          <div style="font-size:12px; text-align:center; margin-bottom:12px;">이 구성에 동의하십니까?</div>
          <div class="action-btn-group">
            <button class="game-btn btn-yes" id="vote-yes">찬성 ⭕</button>
            <button class="game-btn btn-no" id="vote-no">반대 ❌</button>
          </div>
        `;

        document.getElementById('vote-yes').onclick = () => sendVote(true);
        document.getElementById('vote-no').onclick = () => sendVote(false);

      } else if (phase === 'ACTION_PHASE') {
        phaseTitle.textContent = '⚔️ 행동 제출 페이즈';
        const isExpedition = me.zone === 'EXPEDITION';

        if (isExpedition) {
          stageContent.innerHTML = `
            <div style="font-size:12px; color:#ff9ebb; font-weight:bold;">당신은 [토벌조]입니다!</div>
            <div style="font-size:11px; color:#aaa;">제출할 카드를 손패에서 1장 선택하세요.</div>
            <div class="hand-cards" id="hand-list"></div>
            <button class="game-btn btn-sub" id="btn-submit-card" style="margin-top:10px;" disabled>카드 제출</button>
          `;

          const handList = document.getElementById('hand-list');
          selectedCard = null;

          (me.hand || []).forEach(c => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card-item';
            cardEl.textContent = c;
            cardEl.onclick = () => {
              document.querySelectorAll('.card-item').forEach(el => el.classList.remove('selected'));
              cardEl.classList.add('selected');
              selectedCard = c;
              document.getElementById('btn-submit-card').disabled = false;
            };
            handList.appendChild(cardEl);
          });

          document.getElementById('btn-submit-card').onclick = () => {
            if (selectedCard !== null) {
              ws.send(JSON.stringify({ type: 'SUBMIT_ACTION', cards: [selectedCard], card_types: ['DEFENSE'] }));
              stageContent.innerHTML = `<div style="font-size:13px; text-align:center; padding:20px;">카드 제출 완료! 다른 플레이어를 기다리는 중...</div>`;
            }
          };
        } else {
          stageContent.innerHTML = `
            <div style="font-size:12px; color:#52c41a; font-weight:bold;">당신은 [잔류조]입니다!</div>
            <div style="font-size:11px; color:#aaa;">마을 행동을 선택하세요:</div>
            <div class="action-btn-group" style="flex-direction:column; gap:6px; margin-top:8px;">
              <button class="game-btn btn-sub" id="act-bless">✨ 축복하기 (카드 1장 드로우 지원)</button>
              <button class="game-btn btn-sub" id="act-predict">🔮 예언하기 (피해 예측)</button>
            </div>
          `;

          document.getElementById('act-bless').onclick = () => submitVillageAction('BLESS');
          document.getElementById('act-predict').onclick = () => submitVillageAction('PREDICT');
        }

      } else if (phase === 'GAME_OVER') {
        phaseTitle.textContent = '🏆 게임 종료';
        stageContent.innerHTML = `
          <div style="font-size:16px; font-weight:900; text-align:center; padding:20px; color:#ff85a2;">
            게임이 종료되었습니다!
          </div>
          <button class="game-btn btn-sub" onclick="location.href='lobby.html?room=${roomId}'">대기실로 돌아가기</button>
        `;
      }
    }

    function sendVote(val) {
      ws.send(JSON.stringify({ type: 'VOTE', vote: val }));
      stageContent.innerHTML = `<div style="font-size:13px; text-align:center; padding:20px;">투표 완료! 결과를 기다리는 중...</div>`;
    }

    function submitVillageAction(act) {
      ws.send(JSON.stringify({ type: 'SUBMIT_ACTION', action: act }));
      stageContent.innerHTML = `<div style="font-size:13px; text-align:center; padding:20px;">행동 제출 완료! 결과를 기다리는 중...</div>`;
    }
  })();
</script>
</body>
</html>
